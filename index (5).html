  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap');
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{background:#0e0e11}
    .ht-root{background:#0e0e11;color:#e8e6f0;font-family:'Syne',sans-serif;min-height:100vh;padding:1.5rem 1.5rem 2rem;max-width:600px;margin:0 auto}
    .ht-tabs{display:flex;gap:3px;background:#16151f;border-radius:12px;padding:4px;margin-bottom:1.5rem;border:1px solid #1f1e2e;overflow-x:auto}
    .ht-tab{flex:1;min-width:0;padding:8px 4px;text-align:center;font-size:10px;font-weight:600;border-radius:9px;cursor:pointer;color:#4e4b63;transition:all .15s;font-family:'DM Mono',monospace;letter-spacing:.3px;text-transform:uppercase;border:none;background:none;white-space:nowrap}
    .ht-tab.active{background:#7c6fff;color:#fff}
    .ht-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:1.5rem}
    .ht-title{font-size:24px;font-weight:700;letter-spacing:-.5px;color:#f0eeff}
    .ht-title-sub{font-size:11px;font-family:'DM Mono',monospace;color:#7c6fff;margin-top:2px}
    .ht-date{font-family:'DM Mono',monospace;font-size:11px;color:#6b6880;text-align:right}
    .ht-week-strip{display:flex;gap:6px;margin-bottom:1.5rem}
    .ht-day-pill{flex:1;background:#1a1a22;border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer;border:1.5px solid transparent;transition:all .15s}
    .ht-day-pill.active{border-color:#7c6fff;background:#1e1b30}
    .ht-day-pill .day-name{font-size:10px;color:#6b6880;font-family:'DM Mono',monospace;letter-spacing:.5px;text-transform:uppercase}
    .ht-day-pill .day-num{font-size:16px;font-weight:600;color:#c8c2e8;margin-top:2px}
    .ht-day-pill.active .day-name,.ht-day-pill.active .day-num{color:#a899ff}
    .ht-section-title{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#4e4b63;font-family:'DM Mono',monospace;margin-bottom:12px}
    .ht-habits-list{display:flex;flex-direction:column;gap:10px;margin-bottom:2rem}
    .ht-habit-card{background:#16151f;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px;border:1px solid #1f1e2e;cursor:pointer;transition:all .15s;user-select:none}
    .ht-habit-card:hover{border-color:#2d2b45;background:#18172a}
    .ht-habit-card.done{border-color:#2e2850;background:#19173a}
    .ht-habit-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:#1e1c2e}
    .ht-habit-card.done .ht-habit-icon{background:#24204a}
    .ht-habit-info{flex:1}
    .ht-habit-name{font-size:15px;font-weight:600;color:#d4d0ef}
    .ht-habit-card.done .ht-habit-name{color:#a899ff}
    .ht-habit-streak{font-size:11px;color:#4e4b63;font-family:'DM Mono',monospace;margin-top:2px}
    .ht-habit-card.done .ht-habit-streak{color:#6b63b5}
    .ht-check{width:26px;height:26px;border-radius:50%;border:1.5px solid #2e2c45;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
    .ht-habit-card.done .ht-check{background:#7c6fff;border-color:#7c6fff}
    .ht-check-svg{display:none}
    .ht-habit-card.done .ht-check-svg{display:block}
    .ht-delete-btn{background:none;border:none;color:#2e2c45;cursor:pointer;font-size:14px;padding:4px;border-radius:6px;transition:color .15s;flex-shrink:0}
    .ht-delete-btn:hover{color:#e24b4a}
    .ht-progress-bar-wrap{background:#1a1a22;border-radius:999px;height:6px;margin-bottom:1.5rem;overflow:hidden}
    .ht-progress-bar{height:100%;border-radius:999px;background:linear-gradient(90deg,#6255cc,#a899ff);transition:width .4s cubic-bezier(.4,0,.2,1)}
    .ht-progress-label{display:flex;justify-content:space-between;margin-bottom:8px}
    .ht-progress-text{font-size:12px;color:#6b6880;font-family:'DM Mono',monospace}
    .ht-stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.5rem}
    .ht-stat-card{background:#16151f;border-radius:12px;padding:12px;border:1px solid #1f1e2e;text-align:center}
    .ht-stat-val{font-size:22px;font-weight:700;color:#a899ff;font-family:'DM Mono',monospace}
    .ht-stat-label{font-size:10px;color:#4e4b63;font-family:'DM Mono',monospace;margin-top:3px;letter-spacing:.5px;text-transform:uppercase}
    .ht-add-input{flex:1;background:#16151f;border:1px solid #1f1e2e;border-radius:10px;padding:10px 14px;font-size:14px;font-family:'Syne',sans-serif;color:#e8e6f0;outline:none;transition:border-color .15s}
    .ht-add-input::placeholder{color:#3e3c55}
    .ht-add-input:focus{border-color:#4a4580}
    .ht-emoji-pick{background:#16151f;border:1px solid #1f1e2e;border-radius:10px;font-size:18px;cursor:pointer;width:44px;height:44px;display:flex;align-items:center;justify-content:center}

    @keyframes fadeIn{from{opacity:0}to{opacity:1}}

    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
    @keyframes particles{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-120px) scale(0);opacity:0}}
    .epic-icon{font-size:80px;animation:scaleUp .5s cubic-bezier(.17,.67,.3,1.3) forwards;margin-bottom:16px}

<body>
<div class="ht-root" id="app"></div>
<div class="epic-overlay" id="epic-overlay" onclick="closeEpic()">
  <div class="epic-particles" id="epic-particles"></div>
  <div class="epic-icon" id="epic-icon">⬛</div>
  <div class="epic-type" id="epic-type">nouveau rang</div>
  <div class="epic-title" id="epic-title" style="color:#a899ff">Rang S</div>
  <div class="epic-sub" id="epic-sub">Monarque des Ombres</div>
  <button class="epic-close">Continuer →</button>
</div>
<script>
  const EMOJIS=['🏃','📚','🧘','💤','💼','🍎','💧','✍️','🎯','🎨','🎵','🌿','🧠','💪','🌅','🏊','🚴','🧩'];
  const DAYS=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
  const MUSCLES=['Pectoraux','Dos','Épaules','Biceps','Triceps','Jambes','Abdos','Fessiers'];
  const DAYS_FR=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  const MONTHS_FR=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

  const RANKS=[
    {id:'E',name:'Rang E',class:'Éveillé Ordinaire',badge:'⬜',color:'#6b6880',glow:'#6b6880',xpRequired:0,xpNext:50,title:'Éveillé'},
    {id:'D',name:'Rang D',class:'Chasseur Novice',badge:'🟦',color:'#378add',glow:'#378add',xpRequired:50,xpNext:150,title:'Novice'},
    {id:'C',name:'Rang C',class:'Chasseur Confirmé',badge:'🟩',color:'#1d9e75',glow:'#1d9e75',xpRequired:150,xpNext:350,title:'Confirmé'},
    {id:'B',name:'Rang B',class:'Chasseur Élite',badge:'🟨',color:'#ef9f27',glow:'#ef9f27',xpRequired:350,xpNext:700,title:'Élite'},
    {id:'A',name:'Rang A',class:'Chasseur Vétéran',badge:'🟥',color:'#e24b4a',glow:'#e24b4a',xpRequired:700,xpNext:1200,title:'Vétéran'},
    {id:'S',name:'Rang S',class:'Monarque des Ombres',badge:'⬛',color:'#a899ff',glow:'#7c6fff',xpRequired:1200,xpNext:9999,title:'Monarque'},
  ];

  const BADGES=[
    {id:'first',icon:'🌟',name:'Première quête',desc:'Coche ta 1ère habitude',check:s=>Object.keys(s.log).length>=1},
    {id:'streak7',icon:'🔥',name:'7 jours',desc:'7 jours de suite',check:s=>bestStreakFromState(s)>=7},
    {id:'streak30',icon:'💎',name:'30 jours',desc:'30 jours de suite',check:s=>bestStreakFromState(s)>=30},
    {id:'streak100',icon:'⚡',name:'Inarrêtable',desc:'100 jours de streak',check:s=>bestStreakFromState(s)>=100},
    {id:'perfectweek',icon:'📅',name:'Semaine parfaite',desc:'7/7 habitudes sur 7 jours',check:s=>{
      const today=new Date();
      for(let i=0;i<7;i++){const d=new Date(today);d.setDate(today.getDate()-i);const ds=d.toISOString().split('T')[0];if(s.habits.some(h=>!s.log[ds+'_'+h.id]))return false}
      return s.habits.length>0;
    }},
    {id:'perfectmonth',icon:'🗓️',name:'Mois parfait',desc:'30 jours sans rater',check:s=>{
      const today=new Date();
      for(let i=0;i<30;i++){const d=new Date(today);d.setDate(today.getDate()-i);const ds=d.toISOString().split('T')[0];if(s.habits.some(h=>!s.log[ds+'_'+h.id]))return false}
      return s.habits.length>0;
    }},
    {id:'fullcombo',icon:'💥',name:'Full combo',desc:'Toutes les habitudes en 1 jour',check:s=>{
      const today=new Date().toISOString().split('T')[0];
      return s.habits.length>0&&s.habits.every(h=>s.log[today+'_'+h.id]);
    }},
    {id:'missions50',icon:'⚔️',name:'50 missions',desc:'50 habitudes complétées',check:s=>Object.keys(s.log).length>=50},
    {id:'missions100',icon:'🏆',name:'100 missions',desc:'100 habitudes complétées',check:s=>Object.keys(s.log).length>=100},
    {id:'missions200',icon:'🎯',name:'Chasseur',desc:'200 missions complétées',check:s=>Object.keys(s.log).length>=200},
    {id:'missions500',icon:'👑',name:'Légende',desc:'500 missions complétées',check:s=>Object.keys(s.log).length>=500},
    {id:'rankD',icon:'🟦',name:'Rang D',desc:'Atteindre le rang D',check:s=>totalXPFromLog(s.log)>=50},
    {id:'rankC',icon:'🟩',name:'Rang C',desc:'Atteindre le rang C',check:s=>totalXPFromLog(s.log)>=150},
    {id:'rankB',icon:'🟨',name:'Rang B',desc:'Atteindre le rang B',check:s=>totalXPFromLog(s.log)>=350},
    {id:'rankA',icon:'🟥',name:'Rang A',desc:'Atteindre le rang A',check:s=>totalXPFromLog(s.log)>=700},
    {id:'rankS',icon:'⬛',name:'Arise',desc:'Rang S — Monarque des Ombres',check:s=>totalXPFromLog(s.log)>=1200},
    {id:'firstPR',icon:'💪',name:'Premier PR',desc:'Bats ton 1er record',check:s=>(s.perfs?.exercises||[]).some(e=>e.cells.some(c=>c.val))},
    {id:'pr3',icon:'📈',name:'En progression',desc:'Bats 3 PR différents',check:s=>(s.perfs?.exercises||[]).filter(e=>e.cells.some(c=>c.val)).length>=3},
    {id:'exo5',icon:'🎽',name:'Athlète',desc:'5 exercices dans Perfs',check:s=>(s.perfs?.exercises||[]).length>=5},
    {id:'exo10',icon:'🏋️',name:'Powerlifter',desc:'10 perfs enregistrées',check:s=>(s.perfs?.exercises||[]).reduce((n,e)=>n+e.cells.filter(c=>c.val).length,0)>=10},
    {id:'corps',icon:'📏',name:'Suivi corps',desc:'Enregistre tes mensurations',check:s=>Object.values(s.corps||{}).some(m=>m.entries&&m.entries.length>0)},
    {id:'corps10',icon:'⚖️',name:'Transformation',desc:'10 mesures corps enregistrées',check:s=>Object.values(s.corps||{}).reduce((n,m)=>n+(m.entries?.length||0),0)>=10},
    {id:'eveil',icon:'👁️',name:"L'Éveil",desc:'Débloque ton premier badge',check:s=>s.unlockedBadges&&s.unlockedBadges.length>=1},
    {id:'porte',icon:'🕳️',name:'La Porte',desc:'7 habitudes en un jour',check:s=>{
      const today=new Date().toISOString().split('T')[0];
      return s.habits.filter(h=>s.log[today+'_'+h.id]).length>=7;
    }},
    {id:'shadow',icon:'🗡️',name:"Chasseur d'ombre",desc:'30 jours de streak',check:s=>bestStreakFromState(s)>=30},
  ];

  function totalXPFromLog(log){return Object.keys(log).length*3}
  function bestStreakFromState(s){
    if(!s.habits||!s.habits.length)return 0;
    return Math.max(...s.habits.map(h=>{
      let streak=0;const today=new Date();
      for(let i=0;i<90;i++){const d=new Date(today);d.setDate(today.getDate()-i);if(s.log[d.toISOString().split('T')[0]+'_'+h.id])streak++;else break}
      return streak;
    }));
  }

  function getToday(){return new Date().toISOString().split('T')[0]}
  function getWeekDates(offset){const today=new Date(),dow=today.getDay();return Array.from({length:7},(_,i)=>{const d=new Date(today);d.setDate(today.getDate()-dow+i+(offset||0)*7);return d})}
  function getDateStr(){const d=new Date();return d.getDate()+'/'+(d.getMonth()+1)}

  function loadState(){try{const s=localStorage.getItem('the_system_v2');if(s)return JSON.parse(s)}catch(e){}return null}
  function saveState(){try{localStorage.setItem('the_system_v2',JSON.stringify(state))}catch(e){}}

  const defaultState={
    tab:'habits',
    habits:[
      {id:1,name:'Sport / Exercice',icon:'🏃'},
      {id:2,name:'Lecture',icon:'📚'},
      {id:3,name:'Méditation',icon:'🧘'},
      {id:4,name:'Sommeil',icon:'💤'},
      {id:5,name:'Travail / Productivité',icon:'💼'},
    ],
    log:{},selectedDate:getToday(),newName:'',newIcon:'🎯',emojiOpen:false,nextId:6,
    chartPeriod:'7d',chartType:'bar',weekOffset:0,
    perfs:{exercises:[{id:1,name:'Développé couché',cells:[{val:'',date:''},{val:'',date:''},{val:'',date:''}]},{id:2,name:'Squat',cells:[{val:'',date:''},{val:'',date:''},{val:'',date:''}]}],nextId:3},
    corps:{
      poids:{entries:[],draft:''},
      taille:{entries:[],draft:''},
      bras:{entries:[],draft:''},
      graisse:{entries:[],draft:''},
    },
    sleep:{entries:[],starDraft:4,hDraft:''},
    quoteIdx:0,
  };

  let state=loadState()||defaultState;
  state.tab=state.tab||'habits';
  state.emojiOpen=false;
  state.selectedDate=getToday();
  state.weekOffset=0;
  if(!state.perfs)state.perfs=defaultState.perfs;
  if(!state.perfs.exercises)state.perfs.exercises=[];
  if(!state.corps)state.corps=defaultState.corps;
  if(!state.corps.poids)state.corps.poids={entries:[],draft:''};
  if(!state.corps.taille)state.corps.taille={entries:[],draft:''};
  if(!state.corps.bras)state.corps.bras={entries:[],draft:''};
  if(!state.corps.graisse)state.corps.graisse={entries:[],draft:''};
  if(!state.sleep)state.sleep={entries:[],starDraft:4,hDraft:''};
  if(!state.unlockedBadges)state.unlockedBadges=[];
  if(state.quoteIdx===undefined)state.quoteIdx=Math.floor(new Date().getDate()%8);

  function logKey(d,id){return d+'_'+id}
  function isDone(d,id){return!!state.log[logKey(d,id)]}
  function totalXP(){return totalXPFromLog(state.log)}
  function currentRank(){const xp=totalXP();let r=RANKS[0];for(const rr of RANKS){if(xp>=rr.xpRequired)r=rr}return r}
  function countDoneToday(){return state.habits.filter(h=>isDone(state.selectedDate,h.id)).length}
  function bestStreak(){return bestStreakFromState(state)}
  function formatDate(ds){const d=new Date(ds+'T00:00:00');return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}
  function addHabit(){const n=state.newName.trim();if(!n)return;state.habits.push({id:state.nextId++,name:n,icon:state.newIcon});state.newName='';state.emojiOpen=false;saveState();render()}
  function deleteHabit(id){state.habits=state.habits.filter(h=>h.id!==id);Object.keys(state.log).forEach(k=>{if(k.endsWith('_'+id))delete state.log[k]});saveState();render()}
  function getDateRange(period){const today=new Date();let days=period==='7d'?7:period==='1m'?30:365;return Array.from({length:days},(_,i)=>{const d=new Date(today);d.setDate(today.getDate()-(days-1)+i);return d.toISOString().split('T')[0]})}
  function habitRateForDates(id,dates){const done=dates.filter(d=>state.log[logKey(d,id)]).length;return dates.length?Math.round((done/dates.length)*100):0}

  // EPIC OVERLAY
  function showEpic(type,icon,title,sub,color){
    const o=document.getElementById('epic-overlay');
    document.getElementById('epic-icon').textContent=icon;
    document.getElementById('epic-type').textContent=type;
    document.getElementById('epic-title').textContent=title;
    document.getElementById('epic-title').style.color=color||'#a899ff';
    document.getElementById('epic-sub').textContent=sub;
    const pp=document.getElementById('epic-particles');
    pp.innerHTML='';
    const colors=['#7c6fff','#a899ff','#ef9f27','#e24b4a','#1d9e75','#378add'];
    for(let i=0;i<18;i++){
      const p=document.createElement('div');
      p.className='particle';
      p.style.cssText=`background:${colors[i%colors.length]};left:${Math.random()*200-100}px;top:${Math.random()*100}px;animation-delay:${Math.random()*.6}s;animation-duration:${.8+Math.random()*.6}s`;
      pp.appendChild(p);
    }
    o.classList.add('show');
    navigator.vibrate&&navigator.vibrate([100,50,200,50,300]);
  }
  function closeEpic(){document.getElementById('epic-overlay').classList.remove('show')}

  // CHECK BADGES & RANK UP
  function checkUnlocks(prevXP){
    const newXP=totalXP();
    const prevRank=RANKS.reduce((r,rr)=>newXP>=rr.xpRequired?rr:r,RANKS[0]);
    const oldRank=RANKS.reduce((r,rr)=>prevXP>=rr.xpRequired?rr:r,RANKS[0]);
    if(prevRank.id!==oldRank.id){
      setTimeout(()=>showEpic('nouveau rang',prevRank.badge,prevRank.name,prevRank.class,prevRank.color),300);
      return;
    }
    BADGES.forEach(b=>{
      if(!state.unlockedBadges.includes(b.id)&&b.check(state)){
        state.unlockedBadges.push(b.id);
        saveState();
        setTimeout(()=>showEpic('badge débloqué',b.icon,b.name,b.desc,'#a899ff'),300);
      }
    });
  }

  function toggleHabit(id){
    const prevXP=totalXP();
    const k=logKey(state.selectedDate,id);
    if(state.log[k])delete state.log[k];else state.log[k]=true;
    saveState();
    checkUnlocks(prevXP);
    render();
  }

  function computeStreak(id){let s=0;const t=new Date();for(let i=0;i<90;i++){const d=new Date(t);d.setDate(t.getDate()-i);if(state.log[logKey(d.toISOString().split('T')[0],id)])s++;else break}return s}

  function renderHabitsTab(){
    const offset=state.weekOffset||0;
    const weekDates=getWeekDates(offset);
    const doneCount=countDoneToday(),total=state.habits.length;
    const pct=total?Math.round((doneCount/total)*100):0;
    const fmtS=d=>d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
    const weekLabel=fmtS(weekDates[0])+' – '+fmtS(weekDates[6]);
    const navBtn=`background:#16151f;border:1px solid #1f1e2e;border-radius:8px;color:#a899ff;font-size:16px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;`;
    const weekHtml=weekDates.map(d=>{const ds=d.toISOString().split('T')[0];const isA=ds===state.selectedDate;const isT=ds===getToday();return`<div class="ht-day-pill${isA?' active':''}" onclick="selectDate('${ds}')"><div class="day-name">${DAYS[d.getDay()]}</div><div class="day-num">${d.getDate()}</div>${isT&&!isA?'<div style="width:4px;height:4px;border-radius:50%;background:#7c6fff;margin:2px auto 0"></div>':'<div style="height:6px"></div>'}</div>`}).join('');
    const habitsHtml=state.habits.map(h=>{const done=isDone(state.selectedDate,h.id);const streak=computeStreak(h.id);return`<div class="ht-habit-card${done?' done':''}" onclick="toggleHabit(${h.id})"><div class="ht-habit-icon">${h.icon}</div><div class="ht-habit-info"><div class="ht-habit-name">${h.name}</div><div class="ht-habit-streak">${streak>0?streak+' jour'+(streak>1?'s':'')+' de suite':"commence aujourd'hui"}</div></div><div class="ht-check"><svg class="ht-check-svg" width="13" height="10" viewBox="0 0 13 10" fill="none"><path d="M1 5L5 9L12 1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><button class="ht-delete-btn" onclick="event.stopPropagation();deleteHabit(${h.id})">✕</button></div>`}).join('');
    const emojiHtml=EMOJIS.map(e=>`<button class="ht-ep-btn" onclick="pickEmoji('${e}')">${e}</button>`).join('');
    return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><button style="${navBtn}" onclick="shiftWeek(-1)">‹</button><div style="flex:1;text-align:center;font-size:11px;font-family:'DM Mono',monospace;color:#6b6880">${weekLabel}</div><button style="${navBtn}" onclick="shiftWeek(1)">›</button>${offset!==0?`<button style="${navBtn};font-size:10px;width:auto;padding:0 8px;color:#7c6fff" onclick="goToToday()">aujourd'hui</button>`:''}</div>
    <div class="ht-week-strip">${weekHtml}</div>
    <div class="ht-stats-grid"><div class="ht-stat-card"><div class="ht-stat-val">${doneCount}/${total}</div><div class="ht-stat-label">aujourd'hui</div></div><div class="ht-stat-card"><div class="ht-stat-val">${bestStreak()}</div><div class="ht-stat-label">streak</div></div><div class="ht-stat-card"><div class="ht-stat-val">${Object.keys(state.log).length}</div><div class="ht-stat-label">total</div></div></div>
    <div class="ht-progress-label"><span class="ht-progress-text">progression du jour</span><span class="ht-progress-text">${pct}%</span></div>
    <div class="ht-progress-bar-wrap"><div class="ht-progress-bar" style="width:${pct}%"></div></div>
    <div class="ht-section-title">habitudes</div>
    <div class="ht-habits-list">${habitsHtml}</div>
    <div class="ht-section-title">ajouter</div>
    <div style="margin-top:.5rem"><div style="display:flex;gap:8px;align-items:center"><div class="ht-emoji-pick" onclick="toggleEmoji()">${state.newIcon}</div><input class="ht-add-input" type="text" placeholder="Nouvelle habitude..." value="${state.newName}" oninput="state.newName=this.value" onkeydown="if(event.key==='Enter')addHabit()"/><button class="ht-add-btn" onclick="addHabit()">+</button></div><div class="ht-emoji-panel${state.emojiOpen?' open':''}">${emojiHtml}</div></div>`;
  }

  function renderPerfsTab(){
    const exoCards=state.perfs.exercises.map(exo=>{
      const cells=exo.cells.map((c,i)=>c.val?`<div class="perf-cell filled" onclick="perfEdit(${exo.id},${i})"><div class="perf-val">${c.val}</div><div class="perf-date">${c.date}</div></div>`:`<div class="perf-cell" onclick="perfEdit(${exo.id},${i})"><div class="perf-val empty">+ perf</div><div class="perf-date"></div></div>`).join('');
      const pr=exo.cells.filter(c=>c.val).length>0?'PR: '+exo.cells.filter(c=>c.val).map(c=>parseFloat(c.val)||0).reduce((a,b)=>Math.max(a,b),0)+'':'';
      return`<div class="perf-card"><div class="perf-card-hdr"><span class="perf-card-name">${exo.name}</span><div style="display:flex;align-items:center;gap:8px">${pr?`<span style="font-size:10px;font-family:'DM Mono',monospace;color:#7c6fff;background:#24204a;padding:3px 8px;border-radius:6px">${pr}</span>`:''}<button class="ht-delete-btn" onclick="perfDelExo(${exo.id})">✕</button></div></div><div class="perf-grid">${cells}<button class="perf-add-cell" onclick="perfAddCell(${exo.id})">+</button></div></div>`;
    }).join('');
    return`<div class="ht-section-title">exercices</div>${exoCards}<div style="display:flex;gap:8px;margin-top:4px"><input class="ht-add-input" id="perf-new-input" type="text" placeholder="Nouvel exercice..." onkeydown="if(event.key==='Enter')perfAddExo()"/><button class="ht-add-btn" onclick="perfAddExo()">+</button></div>`;
  }

  function renderCorpsTab(){
    const metrics=[
      {key:'poids',name:'Poids',unit:'kg',icon:'⚖️'},
      {key:'taille',name:'Tour de taille',unit:'cm',icon:'📐'},
      {key:'bras',name:'Tour de bras',unit:'cm',icon:'💪'},
      {key:'graisse',name:'Masse grasse',unit:'%',icon:'📊'},
    ];
    const cards=metrics.map(m=>{
      const data=state.corps[m.key];
      const entries=data.entries||[];
      const latest=entries.length?entries[entries.length-1]:null;
      const prev=entries.length>1?entries[entries.length-2]:null;
      const delta=latest&&prev?(parseFloat(latest.val)-parseFloat(prev.val)).toFixed(1):null;
      const deltaColor=delta===null?'#4e4b63':parseFloat(delta)>0?'#e24b4a':'#1d9e75';
      const deltaStr=delta===null?'':(parseFloat(delta)>0?'+':'')+delta+' '+m.unit;
      const allEntries=entries;
      const histHtml=allEntries.slice().reverse().map((e,ri)=>{
        const realIdx=allEntries.length-1-ri;
        const prevE=allEntries[realIdx-1];const d=prevE?(parseFloat(e.val)-parseFloat(prevE.val)).toFixed(1):null;
        const dc=d===null?'#4e4b63':parseFloat(d)>0?'#e24b4a':'#1d9e75';
        return`<div class="corps-hist-row"><span class="corps-hist-date">${e.date}</span><span class="corps-hist-val">${e.val} ${m.unit}</span>${d!==null?`<span class="corps-hist-delta" style="color:${dc}">${parseFloat(d)>0?'+':''}${d}</span>`:'<span></span>'}<button onclick="corpsDelete('${m.key}',${realIdx})" style="background:none;border:none;color:#2e2c45;cursor:pointer;font-size:12px;padding:2px 4px;transition:color .15s" onmouseover="this.style.color='#e24b4a'" onmouseout="this.style.color='#2e2c45'">✕</button></div>`;
      }).join('');
      return`<div class="corps-metric-card">
        <div class="corps-metric-hdr">
          <div style="display:flex;align-items:center;gap:8px"><span style="font-size:20px">${m.icon}</span><span class="corps-metric-name">${m.name}</span></div>
          <div style="text-align:right">${latest?`<span class="corps-metric-latest">${latest.val}</span><span class="corps-metric-unit"> ${m.unit}</span>`:''} ${deltaStr?`<span style="font-size:11px;font-family:'DM Mono',monospace;color:${deltaColor};display:block">${deltaStr}</span>`:''}</div>
        </div>
        <div class="corps-add-row">
          <input class="corps-input" id="corps-${m.key}" type="number" step="0.1" placeholder="${m.unit}" value="${data.draft||''}"/>
          <button class="corps-save-btn" onclick="corpsSave('${m.key}')">Enregistrer</button>
        </div>
        ${entries.length?`<div class="corps-history">${histHtml}</div>`:''}
      </div>`;
    }).join('');
    return`<div class="ht-section-title">mensurations</div>${cards}`;
  }

  function renderBadgesSection(){
    const badgeCards=BADGES.map(b=>{
      const unlocked=state.unlockedBadges.includes(b.id);
      return`<div class="badge-card${unlocked?' unlocked':''}"><div class="badge-icon" style="${unlocked?'':'filter:grayscale(1);opacity:.3'}">${b.icon}</div><div class="badge-name">${b.name}</div><div class="badge-desc">${b.desc}</div></div>`;
    }).join('');
    return`<div class="ht-section-title">badges (${state.unlockedBadges.length}/${BADGES.length})</div><div class="badge-grid">${badgeCards}</div>`;
  }

  function renderRankTab(){
    const xp=totalXP(),rank=currentRank();
    const rankIdx=RANKS.findIndex(r=>r.id===rank.id);
    const xpInRank=xp-rank.xpRequired,xpRange=rank.xpNext-rank.xpRequired;
    const pct=rank.id==='S'?100:Math.min(100,Math.round((xpInRank/xpRange)*100));
    const nextRank=RANKS[rankIdx+1];
    const xpToNext=nextRank?nextRank.xpRequired-xp:0;
    const roadHtml=RANKS.map((r,i)=>{let cls='',status='';if(i<rankIdx){cls=' achieved';status='<span class="rank-road-status">✓ atteint</span>'}else if(i===rankIdx){cls=' current';status='<span class="rank-road-status">→ actuel</span>'}else{status=`<span class="rank-road-status">${r.xpRequired} XP</span>`}return`<div class="rank-road-item${cls}"><div class="rank-road-badge">${r.badge}</div><div class="rank-road-info"><div class="rank-road-name">${r.name} — ${r.class}</div><div class="rank-road-req">${r.id==='E'?'rang de départ':r.xpRequired+' XP requis'}</div></div>${status}</div>`}).join('');
    return`<div class="rank-hero"><div class="rank-glow" style="background:${rank.glow}"></div><div class="rank-badge">${rank.badge}</div><div class="rank-label">rang actuel</div><div class="rank-name" style="color:${rank.color}">${rank.name}</div><div class="rank-class">${rank.class}</div><div class="rank-xp-wrap"><div class="rank-xp-label"><span>${xpInRank} / ${rank.id==='S'?'∞':xpRange} XP</span><span>${rank.id==='S'?'rang maximum':xpToNext+' XP pour '+nextRank.id}</span></div><div class="rank-xp-bar-bg"><div class="rank-xp-bar" style="width:${pct}%;background:${rank.color}"></div></div></div></div>
    <div class="rank-stats-grid"><div class="rank-stat"><div class="rank-stat-top"><span class="rank-stat-icon">⚡</span><span class="rank-stat-name">XP total</span></div><div class="rank-stat-val">${xp}</div><div class="rank-stat-sub">+3 XP par habitude</div></div><div class="rank-stat"><div class="rank-stat-top"><span class="rank-stat-icon">🔥</span><span class="rank-stat-name">streak</span></div><div class="rank-stat-val">${bestStreak()}</div><div class="rank-stat-sub">jours consécutifs</div></div><div class="rank-stat"><div class="rank-stat-top"><span class="rank-stat-icon">✅</span><span class="rank-stat-name">missions</span></div><div class="rank-stat-val">${Object.keys(state.log).length}</div><div class="rank-stat-sub">complétées</div></div><div class="rank-stat"><div class="rank-stat-top"><span class="rank-stat-icon">📅</span><span class="rank-stat-name">aujourd'hui</span></div><div class="rank-stat-val">${countDoneToday()}/${state.habits.length}</div><div class="rank-stat-sub">missions du jour</div></div></div>
    <div class="ht-section-title">progression</div><div class="rank-road">${roadHtml}</div>
    ${renderBadgesSection()}`;
  }

  function renderChartTab(){
    const period=state.chartPeriod||'7d',chartType=state.chartType||'bar';
    const dates=getDateRange(period),today=getToday();
    const periodTotal=dates.reduce((s,d)=>s+state.habits.filter(h=>isDone(d,h.id)).length,0);
    const periodMax=dates.length*(state.habits.length||1);
    const periodPct=periodMax?Math.round((periodTotal/periodMax)*100):0;
    const periodLabel=period==='7d'?'7 jours':period==='1m'?'30 jours':'1 an';
    const btnS=(a)=>`background:${a?'#7c6fff':'#1a1a22'};color:${a?'#fff':'#4e4b63'};border:1px solid ${a?'#7c6fff':'#1f1e2e'};border-radius:8px;padding:6px 12px;font-size:11px;font-family:'DM Mono',monospace;cursor:pointer;letter-spacing:.5px;text-transform:uppercase;`;
    const maxH=130,showEvery=dates.length<=7?1:dates.length<=30?5:30;
    let chartHtml='';
    if(chartType==='bar'){const cols=dates.map((ds,i)=>{const done=state.habits.filter(h=>isDone(ds,h.id)).length;const tot=state.habits.length||1;const bH=Math.max(2,Math.round((done/tot)*maxH));const d=new Date(ds+'T00:00:00');const isT=ds===today;const showL=i%showEvery===0||ds===today;const lbl=dates.length<=7?DAYS[d.getDay()]:(d.getDate()+'/'+(d.getMonth()+1));return`<div class="chart-bar-col"><div class="chart-bar" style="height:${bH}px"><div class="chart-bar-fill" style="height:100%"></div></div><div class="chart-bar-label${isT?' today':''}">${showL?lbl:''}</div></div>`}).join('');chartHtml=`<div class="chart-bars" style="gap:${dates.length>30?'2px':'6px'}">${cols}</div>`}
    else{const W=300,H=120,P=8;const tot=state.habits.length||1;const pts=dates.map((ds,i)=>{const done=state.habits.filter(h=>isDone(ds,h.id)).length;return{x:P+(i/Math.max(dates.length-1,1))*(W-P*2),y:H-P-((done/tot)*(H-P*2)),ds}});const pd=pts.map((p,i)=>`${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');const ad=pd+` L${pts[pts.length-1].x.toFixed(1)},${H} L${pts[0].x.toFixed(1)},${H} Z`;const tp=pts.find(p=>p.ds===today);const lbls=pts.filter((_,i)=>i%showEvery===0).map(p=>{const d=new Date(p.ds+'T00:00:00');const l=dates.length<=7?DAYS[d.getDay()]:(d.getDate()+'/'+(d.getMonth()+1));return`<text x="${p.x.toFixed(1)}" y="${H+14}" text-anchor="middle" font-size="9" fill="#4e4b63" font-family="monospace">${l}</text>`}).join('');chartHtml=`<svg viewBox="0 0 ${W} ${H+18}" style="width:100%;height:150px;overflow:visible"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7c6fff" stop-opacity=".3"/><stop offset="100%" stop-color="#7c6fff" stop-opacity="0"/></linearGradient></defs><path d="${ad}" fill="url(#cg)"/><path d="${pd}" fill="none" stroke="#7c6fff" stroke-width="2" stroke-linejoin="round"/>${tp?`<circle cx="${tp.x.toFixed(1)}" cy="${tp.y.toFixed(1)}" r="4" fill="#a899ff"/>`:''}${lbls}</svg>`}
    const habitRows=state.habits.map(h=>{const pct=habitRateForDates(h.id,dates);return`<div class="chart-habit-row"><div class="chart-habit-hdr"><span class="chart-habit-icon">${h.icon}</span><span class="chart-habit-name">${h.name}</span><span class="chart-habit-pct">${pct}%</span></div><div class="chart-habit-bar-bg"><div class="chart-habit-bar-fill" style="width:${pct}%"></div></div></div>`}).join('');
    return`<div class="ht-stats-grid" style="margin-bottom:1.5rem"><div class="ht-stat-card"><div class="ht-stat-val">${periodPct}%</div><div class="ht-stat-label">taux ${periodLabel}</div></div><div class="ht-stat-card"><div class="ht-stat-val">${periodTotal}</div><div class="ht-stat-label">complétées</div></div><div class="ht-stat-card"><div class="ht-stat-val">${totalXP()}</div><div class="ht-stat-label">XP gagnés</div></div></div>
    <div style="display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap"><button style="${btnS(period==='7d')}" onclick="setChartPeriod('7d')">7j</button><button style="${btnS(period==='1m')}" onclick="setChartPeriod('1m')">1m</button><button style="${btnS(period==='1y')}" onclick="setChartPeriod('1y')">1an</button><div style="flex:1"></div><button style="${btnS(chartType==='bar')}" onclick="setChartType('bar')">▐▌</button><button style="${btnS(chartType==='line')}" onclick="setChartType('line')">∿</button></div>
    <div class="chart-card"><div class="chart-title">habitudes — ${periodLabel}</div>${chartHtml}</div>
    <div class="chart-card"><div class="chart-title">taux par habitude</div><div class="chart-habit-rows">${habitRows}</div></div>`;
  }

  const QUOTES=[
    {text:"Je ne recule jamais. Peu importe ce qui se dresse devant moi.",author:"Sung Jin-Woo",rank:"Rang S",badge:"⬛",color:"#a899ff"},
    {text:"La force ne vient pas de la victoire. Elle vient de la lutte.",author:"The System",rank:"Rang A",badge:"🟥",color:"#e24b4a"},
    {text:"Chaque jour sans progresser est un jour perdu.",author:"Sung Jin-Woo",rank:"Rang S",badge:"⬛",color:"#a899ff"},
    {text:"Les faibles ne survivent pas. Deviens fort.",author:"The System",rank:"Rang E",badge:"⬜",color:"#6b6880"},
    {text:"La douleur d'aujourd'hui est la force de demain.",author:"Sung Jin-Woo",rank:"Rang B",badge:"🟨",color:"#ef9f27"},
    {text:"Arise. Ta transformation commence maintenant.",author:"The System",rank:"Rang S",badge:"⬛",color:"#a899ff"},
    {text:"Un chasseur ne dort jamais sur ses lauriers.",author:"Sung Jin-Woo",rank:"Rang C",badge:"🟩",color:"#1d9e75"},
    {text:"Les limites n'existent que dans l'esprit.",author:"The System",rank:"Rang A",badge:"🟥",color:"#e24b4a"},
    {text:"Chaque obstacle est une opportunité de devenir plus fort.",author:"Sung Jin-Woo",rank:"Rang B",badge:"🟨",color:"#ef9f27"},
    {text:"Le chemin vers le sommet est solitaire. Mais la vue en vaut la peine.",author:"Sung Jin-Woo",rank:"Rang S",badge:"⬛",color:"#a899ff"},
    {text:"Ne te bats pas pour survivre. Bats-toi pour dominer.",author:"The System",rank:"Rang A",badge:"🟥",color:"#e24b4a"},
    {text:"La discipline, c'est se souvenir de ce que tu veux vraiment.",author:"The System",rank:"Rang C",badge:"🟩",color:"#1d9e75"},
  ];

  function renderSleepTab(){
    const entries=state.sleep.entries||[];
    const last7=entries.slice(-7);
    const avg=last7.length?Math.round((last7.reduce((s,e)=>s+e.h,0)/last7.length)*10)/10:0;
    const best=last7.length?Math.max(...last7.map(e=>e.h)):0;
    const avgStars=last7.length?Math.round(last7.reduce((s,e)=>s+e.stars,0)/last7.length):0;
    const starColors=['','#e24b4a','#ef9f27','#ef9f27','#1d9e75','#a899ff'];
    const maxH=Math.max(...last7.map(e=>e.h),8);
    const barsHtml=last7.map(e=>{const bH=Math.round((e.h/maxH)*80);const c=starColors[e.stars]||'#7c6fff';return`<div class="sleep-bar-col"><div class="sleep-bar" style="height:${bH}px"><div class="sleep-bar-fill" style="height:100%;background:${c}"></div></div><div class="sleep-bar-lbl">${e.h}h</div></div>`}).join('');
    const starsHtml=[1,2,3,4,5].map(n=>`<span class="sleep-star${n<=(state.sleep.starDraft||4)?' on':''}" onclick="setSleepStar(${n})">★</span>`).join('');
    const histHtml=entries.slice().reverse().slice(0,6).map((e,i)=>{const stars='★'.repeat(e.stars)+'☆'.repeat(5-e.stars);return`<div class="sleep-hist-row"><span class="sleep-hist-date">${e.date}</span><span class="sleep-hist-val">${e.h}h</span><span style="color:#ef9f27;font-size:12px">${stars}</span><button onclick="sleepDelete(${entries.length-1-i})" style="background:none;border:none;color:#2e2c45;cursor:pointer;font-size:12px;padding:2px 4px;transition:color .15s" onmouseover="this.style.color='#e24b4a'" onmouseout="this.style.color='#2e2c45'">✕</button></div>`}).join('');
    return`<div class="ht-stats-grid"><div class="ht-stat-card"><div class="ht-stat-val">${avg||'—'}h</div><div class="ht-stat-label">moyenne</div></div><div class="ht-stat-card"><div class="ht-stat-val">${best||'—'}h</div><div class="ht-stat-label">meilleure</div></div><div class="ht-stat-card"><div class="ht-stat-val" style="color:#ef9f27">${'★'.repeat(avgStars)||'—'}</div><div class="ht-stat-label">qualité moy.</div></div></div>
    <div class="ht-section-title">enregistrer cette nuit</div>
    <div class="chart-card" style="margin-bottom:1.5rem">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <div><div style="font-size:10px;font-family:'DM Mono',monospace;color:#4e4b63;margin-bottom:6px;letter-spacing:1px;text-transform:uppercase">heures</div><input class="sleep-input" id="sleep-h-inp" type="number" step="0.5" min="0" max="24" placeholder="7.5" value="${state.sleep.hDraft||''}"/></div>
        <div style="flex:1"><div style="font-size:10px;font-family:'DM Mono',monospace;color:#4e4b63;margin-bottom:6px;letter-spacing:1px;text-transform:uppercase">qualité</div><div class="sleep-stars">${starsHtml}</div></div>
        <button class="sleep-save-btn" onclick="sleepSave()">✓ Enregistrer</button>
      </div>
    </div>
    ${last7.length?`<div class="ht-section-title">7 dernières nuits</div><div class="chart-card" style="margin-bottom:1.5rem"><div class="sleep-bars">${barsHtml}</div></div>`:''}
    ${entries.length?`<div class="ht-section-title">historique</div><div class="chart-card">${histHtml}</div>`:''}`;
  }

  function renderQuotesTab(){
    const idx=state.quoteIdx%QUOTES.length;
    const q=QUOTES[idx];
    const listHtml=QUOTES.map((qq,i)=>`<div class="quote-list-item${i===idx?' active':''}" onclick="setQuote(${i})"><div class="quote-list-text">"${qq.text}"</div><div class="quote-list-meta">${qq.badge} ${qq.author} · ${qq.rank}</div></div>`).join('');
    return`<div class="ht-section-title">citation du jour</div>
    <div class="quote-card">
      <div class="quote-rank-badge">${q.badge}</div>
      <div class="quote-type">Solo Leveling · ${q.rank}</div>
      <div class="quote-text" style="color:${q.color}">"${q.text}"</div>
      <div class="quote-author">— ${q.author}</div>
    </div>
    <div class="quote-nav">
      <button class="quote-nav-btn" onclick="prevQuote()">‹</button>
      <button class="quote-nav-btn" onclick="nextQuote()">›</button>
    </div>
    <div class="ht-section-title" style="margin-top:1.5rem">toutes les citations</div>
    ${listHtml}`;
  }

  function renderClockTab(){
    const total=state.habits.length||1,done=countDoneToday(),remaining=total-done,pct=Math.round((done/total)*100);
    const now=new Date(),dateStr=DAYS_FR[now.getDay()]+' '+now.getDate()+' '+MONTHS_FR[now.getMonth()]+' '+now.getFullYear();
    const rank=currentRank();
    return`<div class="clock-wrap">
      <div style="font-size:11px;font-family:'DM Mono',monospace;color:${rank.color};letter-spacing:2px;text-transform:uppercase;margin-bottom:12px">${rank.badge} ${rank.class}</div>
      <div class="clock-time"><span id="clock-h">--</span>:<span id="clock-m">--</span><span class="clock-secs">:<span id="clock-s">--</span></span></div>
      <div class="clock-date-str">${dateStr}</div>
    </div>
    <div class="clock-quests-card">
      <div class="clock-quest-num">${remaining}</div>
      <div class="clock-quest-label">quête${remaining>1?'s':''} restante${remaining>1?'s':''} aujourd'hui</div>
      <div class="clock-quest-bar-bg"><div class="clock-quest-bar-fill" style="width:${pct}%"></div></div>
    </div>`;
  }

  function startClock(){
    clearInterval(window._clockInterval);
    const tick=()=>{const now=new Date();const h=document.getElementById('clock-h');const m=document.getElementById('clock-m');const s=document.getElementById('clock-s');if(h)h.textContent=String(now.getHours()).padStart(2,'0');if(m)m.textContent=String(now.getMinutes()).padStart(2,'0');if(s)s.textContent=String(now.getSeconds()).padStart(2,'0')};
    tick();window._clockInterval=setInterval(tick,1000);
  }

  function render(){
    const app=document.getElementById('app');
    const rank=currentRank();
    const tabs=`<div class="ht-tabs"><button class="ht-tab${state.tab==='habits'?' active':''}" onclick="setTab('habits')">Quêtes</button><button class="ht-tab${state.tab==='perfs'?' active':''}" onclick="setTab('perfs')">Perfs</button><button class="ht-tab${state.tab==='corps'?' active':''}" onclick="setTab('corps')">Corps</button><button class="ht-tab${state.tab==='sleep'?' active':''}" onclick="setTab('sleep')">Sommeil</button><button class="ht-tab${state.tab==='chart'?' active':''}" onclick="setTab('chart')">Stats</button><button class="ht-tab${state.tab==='rank'?' active':''}" onclick="setTab('rank')">Rang</button><button class="ht-tab${state.tab==='quotes'?' active':''}" onclick="setTab('quotes')">✦</button><button class="ht-tab${state.tab==='clock'?' active':''}" onclick="setTab('clock')">⏱</button></div>`;
    let content='';
    if(state.tab==='habits')content=renderHabitsTab();
    else if(state.tab==='perfs')content=renderPerfsTab();
    else if(state.tab==='corps')content=renderCorpsTab();
    else if(state.tab==='sleep')content=renderSleepTab();
    else if(state.tab==='chart')content=renderChartTab();
    else if(state.tab==='rank')content=renderRankTab();
    else if(state.tab==='quotes')content=renderQuotesTab();
    else if(state.tab==='clock')content=renderClockTab();
    app.innerHTML=`<div class="ht-header"><div><div class="ht-title">Daily Quests</div><div class="ht-title-sub">${rank.badge} ${rank.title} · ${totalXP()} XP</div></div><div class="ht-date">${formatDate(state.selectedDate)}</div></div>${tabs}${content}`;
    if(state.tab==='clock')startClock();
  }

  window.toggleHabit=toggleHabit;
  window.selectDate=d=>{state.selectedDate=d;saveState();render()};
  window.toggleEmoji=()=>{state.emojiOpen=!state.emojiOpen;render()};
  window.pickEmoji=e=>{state.newIcon=e;state.emojiOpen=false;render()};
  window.addHabit=addHabit;
  window.deleteHabit=deleteHabit;
  window.setTab=t=>{state.tab=t;saveState();render()};
  window.shiftWeek=d=>{state.weekOffset=(state.weekOffset||0)+d;render()};
  window.goToToday=()=>{state.weekOffset=0;state.selectedDate=getToday();render()};
  window.setChartPeriod=p=>{state.chartPeriod=p;saveState();render()};
  window.setChartType=t=>{state.chartType=t;saveState();render()};
  window.closeEpic=closeEpic;
  window.perfEdit=(exoId,idx)=>{const exo=state.perfs.exercises.find(e=>e.id===exoId);if(!exo)return;const cur=exo.cells[idx].val;const val=prompt('Entrez votre perf (ex: 85kg, 12 reps...)',cur||'');if(val===null)return;const prevMax=exo.cells.filter(c=>c.val).reduce((m,c)=>Math.max(m,parseFloat(c.val)||0),0);exo.cells[idx]={val:val.trim(),date:val.trim()?getDateStr():''};const newMax=exo.cells.filter(c=>c.val).reduce((m,c)=>Math.max(m,parseFloat(c.val)||0),0);if(val.trim()&&newMax>prevMax&&prevMax>0)setTimeout(()=>showEpic('nouveau record',exo.cells[idx].val.includes('kg')?'🏋️':'💪','PR BATTU !',exo.name+' → '+val,'#ef9f27'),300);saveState();render()};
  window.perfAddCell=exoId=>{const exo=state.perfs.exercises.find(e=>e.id===exoId);if(exo)exo.cells.push({val:'',date:''});saveState();render()};
  window.perfDelExo=id=>{state.perfs.exercises=state.perfs.exercises.filter(e=>e.id!==id);saveState();render()};
  window.perfAddExo=()=>{const inp=document.getElementById('perf-new-input');if(!inp)return;const name=inp.value.trim();if(!name)return;state.perfs.exercises.push({id:state.perfs.nextId++,name,cells:[{val:'',date:''},{val:'',date:''},{val:'',date:''}]});inp.value='';saveState();render()};
  window.setSleepStar=n=>{state.sleep.starDraft=n;render()};
  window.sleepSave=()=>{const inp=document.getElementById('sleep-h-inp');if(!inp)return;const h=parseFloat(inp.value);if(!h)return;state.sleep.entries.push({h,stars:state.sleep.starDraft||4,date:getDateStr()});state.sleep.hDraft='';saveState();render()};
  window.sleepDelete=idx=>{state.sleep.entries.splice(idx,1);saveState();render()};
  window.nextQuote=()=>{state.quoteIdx=(state.quoteIdx+1)%QUOTES.length;saveState();render()};
  window.prevQuote=()=>{state.quoteIdx=(state.quoteIdx-1+QUOTES.length)%QUOTES.length;saveState();render()};
  window.setQuote=i=>{state.quoteIdx=i;saveState();render()};
  window.corpsDelete=(key,idx)=>{state.corps[key].entries.splice(idx,1);saveState();render()};
  window.corpsSave=key=>{const inp=document.getElementById('corps-'+key);if(!inp)return;const val=inp.value.trim();if(!val)return;state.corps[key].entries.push({val,date:getDateStr()});state.corps[key].draft='';checkUnlocks(totalXP());saveState();render()};

  render();
</script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>{regs.forEach(r=>r.unregister())});
}
</script>
</body>
</html>
