  <meta name="apple-mobile-web-app-title" content="Mes Habitudes">
  <meta name="application-name" content="Mes Habitudes">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: #0e0e11; }
    .ht-root {
      background: #0e0e11; color: #e8e6f0; font-family: 'Syne', sans-serif;
      min-height: 100vh; padding: 2rem 1.5rem; max-width: 600px; margin: 0 auto;
    }
    .ht-tabs { display: flex; gap: 4px; background: #16151f; border-radius: 12px; padding: 4px; margin-bottom: 2rem; border: 1px solid #1f1e2e; }
    .ht-tab { flex: 1; padding: 9px 0; text-align: center; font-size: 13px; font-weight: 600; border-radius: 9px; cursor: pointer; color: #4e4b63; transition: all 0.15s; font-family: 'DM Mono', monospace; letter-spacing: 0.5px; text-transform: uppercase; border: none; background: none; }
    .ht-tab.active { background: #7c6fff; color: #fff; }
    .ht-tab:hover:not(.active) { color: #9183ff; }
    .ht-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem; }
    .ht-title { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; color: #f0eeff; }
    .ht-date { font-family: 'DM Mono', monospace; font-size: 12px; color: #6b6880; text-align: right; }
    .ht-week-strip { display: flex; gap: 6px; margin-bottom: 2rem; }
    .ht-day-pill { flex: 1; background: #1a1a22; border-radius: 10px; padding: 8px 4px; text-align: center; cursor: pointer; border: 1.5px solid transparent; transition: all 0.15s; }
    .ht-day-pill.active { border-color: #7c6fff; background: #1e1b30; }
    .ht-day-pill .day-name { font-size: 10px; color: #6b6880; font-family: 'DM Mono', monospace; letter-spacing: 0.5px; text-transform: uppercase; }
    .ht-day-pill .day-num { font-size: 16px; font-weight: 600; color: #c8c2e8; margin-top: 2px; }
    .ht-day-pill.active .day-name, .ht-day-pill.active .day-num { color: #a899ff; }
    .ht-section-title { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #4e4b63; font-family: 'DM Mono', monospace; margin-bottom: 12px; }
    .ht-habits-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 2rem; }
    .ht-habit-card { background: #16151f; border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; border: 1px solid #1f1e2e; cursor: pointer; transition: all 0.15s; user-select: none; }
    .ht-habit-card:hover { border-color: #2d2b45; background: #18172a; }
    .ht-habit-card.done { border-color: #2e2850; background: #19173a; }
    .ht-habit-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; background: #1e1c2e; }
    .ht-habit-card.done .ht-habit-icon { background: #24204a; }
    .ht-habit-info { flex: 1; }
    .ht-habit-name { font-size: 15px; font-weight: 600; color: #d4d0ef; }
    .ht-habit-card.done .ht-habit-name { color: #a899ff; }
    .ht-habit-streak { font-size: 11px; color: #4e4b63; font-family: 'DM Mono', monospace; margin-top: 2px; }
    .ht-habit-card.done .ht-habit-streak { color: #6b63b5; }
    .ht-check { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid #2e2c45; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; }
    .ht-habit-card.done .ht-check { background: #7c6fff; border-color: #7c6fff; }
    .ht-check-svg { display: none; }
    .ht-habit-card.done .ht-check-svg { display: block; }
    .ht-delete-btn { background: none; border: none; color: #2e2c45; cursor: pointer; font-size: 14px; padding: 4px; border-radius: 6px; transition: color 0.15s; flex-shrink: 0; }
    .ht-delete-btn:hover { color: #e24b4a; }
    .ht-progress-bar-wrap { background: #1a1a22; border-radius: 999px; height: 6px; margin-bottom: 2rem; overflow: hidden; }
    .ht-progress-bar { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #6255cc, #a899ff); transition: width 0.4s cubic-bezier(.4,0,.2,1); }
    .ht-progress-label { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .ht-progress-text { font-size: 12px; color: #6b6880; font-family: 'DM Mono', monospace; }
    .ht-stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 2rem; }
    .ht-stat-card { background: #16151f; border-radius: 12px; padding: 12px; border: 1px solid #1f1e2e; text-align: center; }
    .ht-stat-val { font-size: 22px; font-weight: 700; color: #a899ff; font-family: 'DM Mono', monospace; }
    .ht-stat-label { font-size: 10px; color: #4e4b63; font-family: 'DM Mono', monospace; margin-top: 3px; letter-spacing: 0.5px; text-transform: uppercase; }
    .ht-add-section { margin-top: 0.5rem; }
    .ht-add-row { display: flex; gap: 8px; align-items: center; }
    .ht-add-input { flex: 1; background: #16151f; border: 1px solid #1f1e2e; border-radius: 10px; padding: 10px 14px; font-size: 14px; font-family: 'Syne', sans-serif; color: #e8e6f0; outline: none; transition: border-color 0.15s; }
    .ht-add-input::placeholder { color: #3e3c55; }

<body>
<div class="ht-root" id="app"></div>
<script>
  const EMOJIS = ['🏃','📚','🧘','💤','💼','🍎','💧','✍️','🎯','🎨','🎵','🌿','🧠','💪','🌅','🏊','🚴','🧩'];
  const DAYS = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
  const RANKS = [
    { id: 'E', name: 'Rang E', class: 'Éveillé Ordinaire', badge: '⬜', color: '#6b6880', glow: '#6b6880', xpRequired: 0, xpNext: 50 },
    { id: 'D', name: 'Rang D', class: 'Chasseur Novice', badge: '🟦', color: '#378add', glow: '#378add', xpRequired: 50, xpNext: 150 },
    { id: 'C', name: 'Rang C', class: 'Chasseur Confirmé', badge: '🟩', color: '#1d9e75', glow: '#1d9e75', xpRequired: 150, xpNext: 350 },
    { id: 'B', name: 'Rang B', class: 'Chasseur Élite', badge: '🟨', color: '#ef9f27', glow: '#ef9f27', xpRequired: 350, xpNext: 700 },
    { id: 'A', name: 'Rang A', class: 'Chasseur Vétéran', badge: '🟥', color: '#e24b4a', glow: '#e24b4a', xpRequired: 700, xpNext: 1200 },
    { id: 'S', name: 'Rang S', class: 'Monarque des Ombres', badge: '⬛', color: '#a899ff', glow: '#7c6fff', xpRequired: 1200, xpNext: 9999 },
  ];

  function getToday() { return new Date().toISOString().split('T')[0]; }

  function getWeekDates(offset) {
    const today = new Date();
    const dow = today.getDay();
    return Array.from({length: 7}, (_, i) => {
      const d = new Date(today);
      d.setDate(today.getDate() - dow + i + (offset || 0) * 7);
      return d;
    });
  }

  function loadState() {
    try {
      const saved = localStorage.getItem('habit_tracker_state');
      if (saved) return JSON.parse(saved);
    } catch(e) {}
    return null;
  }

  function saveState() {
    try { localStorage.setItem('habit_tracker_state', JSON.stringify(state)); } catch(e) {}
  }

  const defaultState = {
    tab: 'habits',
    habits: [
      { id: 1, name: 'Sport / Exercice', icon: '🏃' },
      { id: 2, name: 'Lecture', icon: '📚' },
      { id: 3, name: 'Méditation', icon: '🧘' },
      { id: 4, name: 'Sommeil', icon: '💤' },
      { id: 5, name: 'Travail / Productivité', icon: '💼' },
    ],
    log: {},
    selectedDate: getToday(),
    newName: '',
    newIcon: '🎯',
    emojiOpen: false,
    nextId: 6,
    gym: {
      exercises: [
        { id: 1, name: 'Développé couché', muscle: 'Pectoraux', icon: '🏋️' },
        { id: 2, name: 'Squat', muscle: 'Jambes', icon: '🦵' },
        { id: 3, name: 'Soulevé de terre', muscle: 'Dos', icon: '💪' },
        { id: 4, name: 'Développé militaire', muscle: 'Épaules', icon: '🏋️' },
        { id: 5, name: 'Tirage poulie', muscle: 'Dos', icon: '🔗' },
      ],
      sessions: {},
      nextExoId: 6,
    },
    gymOpenExo: null,
    gymDraftSets: {},
    gymNewExo: { name: '', muscle: '', icon: '🏋️' },
    gymAddOpen: false,
  };

  let state = loadState() || defaultState;
  state.tab = state.tab || 'habits';
  state.emojiOpen = false;
  state.selectedDate = getToday();
  state.weekOffset = state.weekOffset || 0;

  function logKey(date, id) { return date + '_' + id; }
  function isDone(date, id) { return !!state.log[logKey(date, id)]; }

  function toggleHabit(id) {
    const k = logKey(state.selectedDate, id);
    if (state.log[k]) delete state.log[k]; else state.log[k] = true;
    saveState(); render();
  }

  function computeStreak(id) {
    let s = 0;
    const today = new Date();
    for (let i = 0; i < 90; i++) {
      const d = new Date(today); d.setDate(today.getDate() - i);
      if (state.log[logKey(d.toISOString().split('T')[0], id)]) s++; else break;
    }
    return s;
  }

  function totalXP() { return Object.keys(state.log).length * 3; }

  function currentRank() {
    const xp = totalXP();
    let rank = RANKS[0];
    for (const r of RANKS) { if (xp >= r.xpRequired) rank = r; }
    return rank;
  }

  function countDoneToday() {
    return state.habits.filter(h => isDone(state.selectedDate, h.id)).length;
  }

  function bestStreak() {
    if (!state.habits.length) return 0;
    return Math.max(...state.habits.map(h => computeStreak(h.id)));
  }

  function getLast7Dates() {
    const today = new Date();
    return Array.from({length: 7}, (_, i) => {
      const d = new Date(today); d.setDate(today.getDate() - 6 + i);
      return d.toISOString().split('T')[0];
    });
  }

  function addHabit() {
    const name = state.newName.trim();
    if (!name) return;
    state.habits.push({ id: state.nextId++, name, icon: state.newIcon });
    state.newName = ''; state.emojiOpen = false;
    saveState(); render();
  }

  function deleteHabit(id) {
    state.habits = state.habits.filter(h => h.id !== id);
    Object.keys(state.log).forEach(k => { if (k.endsWith('_' + id)) delete state.log[k]; });
    saveState(); render();
  }

  function formatDate(ds) {
    const d = new Date(ds + 'T00:00:00');
    return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  }

  function habitCompletionRate(id) {
    const days = getLast7Dates();
    const done = days.filter(d => state.log[logKey(d, id)]).length;
    return Math.round((done / 7) * 100);
  }

  let state = loadState() || defaultState;
  state.tab = state.tab || 'habits';
  state.emojiOpen = false;
  state.selectedDate = getToday();
  state.weekOffset = state.weekOffset || 0;
  if (!state.gym) state.gym = defaultState.gym;
  if (!state.gym.exercises) state.gym.exercises = defaultState.gym.exercises;
  if (!state.gym.sessions) state.gym.sessions = {};
  if (!state.gym.nextExoId) state.gym.nextExoId = 6;
  state.gymOpenExo = null;
  state.gymDraftSets = {};
  state.gymNewExo = { name: '', muscle: '', icon: '🏋️' };
  state.gymAddOpen = false;

  const MUSCLES = ['Pectoraux','Dos','Épaules','Biceps','Triceps','Jambes','Abdos','Fessiers'];

  function gymSessionKey(exoId, date) { return exoId + '_' + date; }

  function gymGetPR(exoId) {
    const sessions = state.gym.sessions;
    let pr = 0;
    Object.keys(sessions).forEach(k => {
      if (k.startsWith(exoId + '_')) {
        sessions[k].forEach(s => { if (s.kg > pr) pr = s.kg; });
      }
    });
    return pr;
  }

  function gymGetLastSession(exoId) {
    const keys = Object.keys(state.gym.sessions)
      .filter(k => k.startsWith(exoId + '_'))
      .sort().reverse();
    if (!keys.length) return null;
    return { date: keys[0].split('_')[1], sets: state.gym.sessions[keys[0]] };
  }

  function gymGetVolume(sets) {
    return sets.reduce((sum, s) => sum + (parseFloat(s.kg)||0) * (parseInt(s.reps)||0), 0);
  }

  function gymSaveSession(exoId) {
    const sets = state.gymDraftSets[exoId];
    if (!sets || !sets.length) return;
    const validSets = sets.filter(s => s.kg && s.reps);
    if (!validSets.length) return;
    const key = gymSessionKey(exoId, getToday());
    state.gym.sessions[key] = validSets;
    state.gymDraftSets[exoId] = null;
    state.gymOpenExo = null;
    saveState(); render();
  }

  function gymDeleteExo(id) {
    state.gym.exercises = state.gym.exercises.filter(e => e.id !== id);
    Object.keys(state.gym.sessions).forEach(k => { if (k.startsWith(id + '_')) delete state.gym.sessions[k]; });
    saveState(); render();
  }

  function gymGetHistory(exoId) {
    return Object.keys(state.gym.sessions)
      .filter(k => k.startsWith(exoId + '_'))
      .sort().reverse().slice(0, 5)
      .map(k => ({ date: k.split('_')[1], sets: state.gym.sessions[k] }));
  }

  function gymMiniChart(exoId) {
    const history = Object.keys(state.gym.sessions)
      .filter(k => k.startsWith(exoId + '_'))
      .sort().slice(-8)
      .map(k => ({ date: k.split('_')[1], maxKg: Math.max(...state.gym.sessions[k].map(s => parseFloat(s.kg)||0)) }));
    if (history.length < 2) return '';
    const maxKg = Math.max(...history.map(h => h.maxKg));
    const W = 280, H = 60, PAD = 6;
    const pts = history.map((h, i) => ({
      x: PAD + (i / (history.length - 1)) * (W - PAD*2),
      y: H - PAD - ((h.maxKg / maxKg) * (H - PAD*2)),
      kg: h.maxKg
    }));
    const pathD = pts.map((p, i) => `${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    const areaD = pathD + ` L${pts[pts.length-1].x.toFixed(1)},${H} L${pts[0].x.toFixed(1)},${H} Z`;
    return `<div class="gym-mini-chart">
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:60px">
        <defs><linearGradient id="gymg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#7c6fff" stop-opacity="0.25"/>
          <stop offset="100%" stop-color="#7c6fff" stop-opacity="0"/>
        </linearGradient></defs>
        <path d="${areaD}" fill="url(#gymg)"/>
        <path d="${pathD}" fill="none" stroke="#7c6fff" stroke-width="1.5" stroke-linejoin="round"/>
        <circle cx="${pts[pts.length-1].x.toFixed(1)}" cy="${pts[pts.length-1].y.toFixed(1)}" r="3" fill="#a899ff"/>
      </svg>
    </div>`;
  }

  function renderGymTab() {
    const today = getToday();
    const btnStyle = (active) => `background:${active?'#7c6fff':'#1a1a22'};color:${active?'#fff':'#4e4b63'};border:1px solid ${active?'#7c6fff':'#1f1e2e'};border-radius:8px;padding:6px 12px;font-size:11px;font-family:'DM Mono',monospace;cursor:pointer;`;

          ${historyHtml}
        </div>` : ''}
      </div>`;
    }).join('');

    const addForm = state.gymAddOpen ? `
      <div class="gym-add-exo-form">
        <div class="ht-section-title" style="margin-bottom:10px">nouvel exercice</div>
        <input class="ht-add-input" style="width:100%;margin-bottom:8px" type="text" placeholder="Nom de l'exercice..." value="${state.gymNewExo.name}" oninput="gymSetNewName(this.value)"/>
        <div class="gym-muscle-grid">
          ${MUSCLES.map(m => `<button class="gym-muscle-btn${state.gymNewExo.muscle===m?' sel':''}" onclick="gymSetMuscle('${m}')">${m}</button>`).join('')}

    return `

        <div class="ht-stat-card"><div class="ht-stat-val">${todaySessions}/${totalExos}</div><div class="ht-stat-label">séances aujourd'hui</div></div>
        <div class="ht-stat-card"><div class="ht-stat-val">${Object.keys(state.gym.sessions).length}</div><div class="ht-stat-label">séances totales</div></div>
        <div class="ht-stat-card"><div class="ht-stat-val">${totalPRs > 0 ? '🔥' + totalPRs : '—'}</div><div class="ht-stat-label">PR aujourd'hui</div></div>

      <div class="ht-section-title">exercices</div>
      ${exoCards}
      ${addForm}
      ${!state.gymAddOpen ? `<button class="gym-add-set-btn" style="margin-top:4px" onclick="gymToggleAdd()">+ Ajouter un exercice</button>` : ''}`;
  }
    const offset = state.weekOffset || 0;
    const weekDates = getWeekDates(offset);
    const doneCount = countDoneToday();
    const total = state.habits.length;
    const pct = total ? Math.round((doneCount / total) * 100) : 0;

    return `
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <button style="${navBtnStyle}" onclick="shiftWeek(-1)">‹</button>
        <div style="flex:1;text-align:center;font-size:11px;font-family:'DM Mono',monospace;color:#6b6880;">${weekLabel}</div>
        <button style="${navBtnStyle}" onclick="shiftWeek(1)">›</button>
        ${offset !== 0 ? `<button style="${navBtnStyle};font-size:10px;width:auto;padding:0 8px;color:#7c6fff" onclick="goToToday()">aujourd'hui</button>` : ''}
      </div>
      <div class="ht-week-strip">${weekHtml}</div>
      <div class="ht-stats-grid">
        <div class="ht-stat-card"><div class="ht-stat-val">${doneCount}/${total}</div><div class="ht-stat-label">aujourd'hui</div></div>

      <div class="ht-section-title">habitudes</div>

  function renderRankTab() {
    const xp = totalXP();
    const rank = currentRank();
    const rankIdx = RANKS.findIndex(r => r.id === rank.id);
    const xpInRank = xp - rank.xpRequired;
    const xpRange = rank.xpNext - rank.xpRequired;
    const pct = rank.id === 'S' ? 100 : Math.min(100, Math.round((xpInRank / xpRange) * 100));
    const nextRank = RANKS[rankIdx + 1];
    const xpToNext = nextRank ? nextRank.xpRequired - xp : 0;
    const roadHtml = RANKS.map((r, i) => {
      let cls = '', status = '';
      if (i < rankIdx) { cls = ' achieved'; status = '<span class="rank-road-status">✓ atteint</span>'; }
      else if (i === rankIdx) { cls = ' current'; status = '<span class="rank-road-status">→ rang actuel</span>'; }
      else { status = `<span class="rank-road-status">${r.xpRequired} XP</span>`; }
      return `<div class="rank-road-item${cls}">
        <div class="rank-road-badge">${r.badge}</div>
        <div class="rank-road-info">
          <div class="rank-road-name">${r.name} — ${r.class}</div>
          <div class="rank-road-req">${r.id === 'E' ? 'rang de départ' : r.xpRequired + ' XP requis'}</div>
        </div>${status}</div>`;
    }).join('');
    return `
      <div class="rank-hero">
        <div class="rank-glow" style="background:${rank.glow}"></div>
        <div class="rank-badge">${rank.badge}</div>
        <div class="rank-label">rang actuel</div>
        <div class="rank-name" style="color:${rank.color}">${rank.name}</div>
        <div class="rank-class">${rank.class}</div>
        <div class="rank-xp-wrap">
          <div class="rank-xp-label">
            <span>${xpInRank} / ${rank.id === 'S' ? '∞' : xpRange} XP</span>
            <span>${rank.id === 'S' ? 'rang maximum' : xpToNext + ' XP pour ' + nextRank.id}</span>
          </div>
          <div class="rank-xp-bar-bg"><div class="rank-xp-bar" style="width:${pct}%;background:${rank.color}"></div></div>
        </div>
      </div>
      <div class="rank-stats-grid">
        <div class="rank-stat"><div class="rank-stat-top"><span class="rank-stat-icon">⚡</span><span class="rank-stat-name">XP total</span></div><div class="rank-stat-val">${xp}</div><div class="rank-stat-sub">+3 XP par habitude</div></div>
        <div class="rank-stat"><div class="rank-stat-top"><span class="rank-stat-icon">🔥</span><span class="rank-stat-name">meilleur streak</span></div><div class="rank-stat-val">${bestStreak()}</div><div class="rank-stat-sub">jours consécutifs</div></div>
        <div class="rank-stat"><div class="rank-stat-top"><span class="rank-stat-icon">✅</span><span class="rank-stat-name">missions</span></div><div class="rank-stat-val">${Object.keys(state.log).length}</div><div class="rank-stat-sub">habitudes complétées</div></div>
        <div class="rank-stat"><div class="rank-stat-top"><span class="rank-stat-icon">📅</span><span class="rank-stat-name">aujourd'hui</span></div><div class="rank-stat-val">${countDoneToday()}/${state.habits.length}</div><div class="rank-stat-sub">missions du jour</div></div>
      </div>
      <div class="ht-section-title">progression des rangs</div>
      <div class="rank-road">${roadHtml}</div>`;
  }

  function getDateRange(period) {
    const today = new Date();
    let days;
    if (period === '7d') days = 7;
    else if (period === '1m') days = 30;
    else days = 365;
    return Array.from({length: days}, (_, i) => {
      const d = new Date(today); d.setDate(today.getDate() - (days - 1) + i);
      return d.toISOString().split('T')[0];
    });
  }

  function habitCompletionRateForDates(id, dates) {
    const done = dates.filter(d => state.log[logKey(d, id)]).length;
    return dates.length ? Math.round((done / dates.length) * 100) : 0;
  }

  function renderBarChart(dates, today) {
    const maxH = 130;
    const showEvery = dates.length <= 7 ? 1 : dates.length <= 30 ? 5 : 30;
    const cols = dates.map((ds, i) => {
      const done = state.habits.filter(h => isDone(ds, h.id)).length;
      const total = state.habits.length || 1;
      const barH = Math.max(2, Math.round((done / total) * maxH));
      const d = new Date(ds + 'T00:00:00');
      const isToday = ds === today;
      const showLabel = i % showEvery === 0 || ds === today;
      const label = dates.length <= 7 ? DAYS[d.getDay()] : (d.getDate() + '/' + (d.getMonth()+1));
      return `<div class="chart-bar-col">
        <div class="chart-bar${isToday ? ' today' : ''}" style="height:${barH}px"><div class="chart-bar-fill" style="height:100%"></div></div>
        <div class="chart-bar-label${isToday ? ' today' : ''}" style="font-size:9px">${showLabel ? label : ''}</div>
      </div>`;
    }).join('');
    return `<div class="chart-bars" style="gap:${dates.length > 30 ? '2px' : '6px'}">${cols}</div>`;
  }

  function renderLineChart(dates, today) {
    const W = 320, H = 130, PAD = 10;
    const total = state.habits.length || 1;
    const points = dates.map((ds, i) => {
      const done = state.habits.filter(h => isDone(ds, h.id)).length;
      const x = PAD + (i / Math.max(dates.length - 1, 1)) * (W - PAD * 2);
      const y = H - PAD - ((done / total) * (H - PAD * 2));
      return { x, y, ds, done };
    });
    const pathD = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    const areaD = pathD + ` L${points[points.length-1].x.toFixed(1)},${H} L${points[0].x.toFixed(1)},${H} Z`;
    const showEvery = dates.length <= 7 ? 1 : dates.length <= 30 ? 5 : 30;
    const labels = points.filter((_, i) => i % showEvery === 0).map(p => {
      const d = new Date(p.ds + 'T00:00:00');
      const label = dates.length <= 7 ? DAYS[d.getDay()] : (d.getDate() + '/' + (d.getMonth()+1));
      return `<text x="${p.x.toFixed(1)}" y="${H + 14}" text-anchor="middle" font-size="9" fill="#4e4b63" font-family="monospace">${label}</text>`;
    }).join('');
    const todayPt = points.find(p => p.ds === today);
    const todayDot = todayPt ? `<circle cx="${todayPt.x.toFixed(1)}" cy="${todayPt.y.toFixed(1)}" r="4" fill="#a899ff"/>` : '';
    return `<svg viewBox="0 0 ${W} ${H+20}" style="width:100%;height:160px;overflow:visible">
      <defs>
        <linearGradient id="areag" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#7c6fff" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#7c6fff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="${areaD}" fill="url(#areag)"/>
      <path d="${pathD}" fill="none" stroke="#7c6fff" stroke-width="2" stroke-linejoin="round"/>
      ${todayDot}
      ${labels}
    </svg>`;
  }

  function renderChartTab() {
    const period = state.chartPeriod || '7d';
    const chartType = state.chartType || 'bar';
    const dates = getDateRange(period);
    const today = getToday();

    const periodTotal = dates.reduce((sum, ds) => sum + state.habits.filter(h => isDone(ds, h.id)).length, 0);
    const periodMax = dates.length * (state.habits.length || 1);
    const periodPct = periodMax ? Math.round((periodTotal / periodMax) * 100) : 0;

    const chartHtml = chartType === 'bar' ? renderBarChart(dates, today) : renderLineChart(dates, today);

    const periodLabel = period === '7d' ? '7 jours' : period === '1m' ? '30 jours' : '1 an';

    const habitRows = state.habits.map(h => {
      const pct = habitCompletionRateForDates(h.id, dates);
      return `<div class="chart-habit-row">
        <div class="chart-habit-hdr">
          <span class="chart-habit-icon">${h.icon}</span>
          <span class="chart-habit-name">${h.name}</span>
          <span class="chart-habit-pct">${pct}%</span>
        </div>
        <div class="chart-habit-bar-bg"><div class="chart-habit-bar-fill" style="width:${pct}%"></div></div>
      </div>`;
    }).join('');

    const btnStyle = (active) => `background:${active ? '#7c6fff' : '#1a1a22'};color:${active ? '#fff' : '#4e4b63'};border:1px solid ${active ? '#7c6fff' : '#1f1e2e'};border-radius:8px;padding:6px 12px;font-size:11px;font-family:'DM Mono',monospace;cursor:pointer;letter-spacing:0.5px;text-transform:uppercase;`;

    return `
      <div class="ht-stats-grid" style="margin-bottom:1.5rem">
        <div class="ht-stat-card"><div class="ht-stat-val">${periodPct}%</div><div class="ht-stat-label">taux ${periodLabel}</div></div>
        <div class="ht-stat-card"><div class="ht-stat-val">${periodTotal}</div><div class="ht-stat-label">complétées</div></div>
        <div class="ht-stat-card"><div class="ht-stat-val">${totalXP()}</div><div class="ht-stat-label">XP gagnés</div></div>
      </div>

      <div style="display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap">
        <button style="${btnStyle(period==='7d')}" onclick="setChartPeriod('7d')">7 jours</button>
        <button style="${btnStyle(period==='1m')}" onclick="setChartPeriod('1m')">1 mois</button>
        <button style="${btnStyle(period==='1y')}" onclick="setChartPeriod('1y')">1 an</button>
        <div style="flex:1"></div>
        <button style="${btnStyle(chartType==='bar')}" onclick="setChartType('bar')">▐▌ Barres</button>
        <button style="${btnStyle(chartType==='line')}" onclick="setChartType('line')">∿ Courbe</button>
      </div>

      <div class="chart-card">
        <div class="chart-title">habitudes complétées — ${periodLabel}</div>
        ${chartHtml}
      </div>
      <div class="chart-card">
        <div class="chart-title">taux de réussite par habitude (${periodLabel})</div>
        <div class="chart-habit-rows">${habitRows}</div>
      </div>`;
  }

  function render() {
    const app = document.getElementById('app');
    const tabsHtml = `<div class="ht-tabs" style="grid-template-columns:repeat(4,1fr)">
      <button class="ht-tab${state.tab==='habits'?' active':''}" onclick="setTab('habits')">Quêtes</button>
      <button class="ht-tab${state.tab==='gym'?' active':''}" onclick="setTab('gym')">Salle</button>
      <button class="ht-tab${state.tab==='chart'?' active':''}" onclick="setTab('chart')">Stats</button>
      <button class="ht-tab${state.tab==='rank'?' active':''}" onclick="setTab('rank')">Rang</button>
    </div>`;
    let content = '';
    if (state.tab === 'habits') content = renderHabitsTab();
    else if (state.tab === 'gym') content = renderGymTab();
    else if (state.tab === 'chart') content = renderChartTab();
    else content = renderRankTab();
    app.innerHTML = `
      <div class="ht-header">
        <div class="ht-title">Daily Quests</div>
        <div class="ht-date">${formatDate(state.selectedDate)}</div>
      </div>
      ${tabsHtml}${content}`;
  }

  window.gymToggleExo = id => {
    if (state.gymOpenExo === id) { state.gymOpenExo = null; }
    else {
      state.gymOpenExo = id;
      if (!state.gymDraftSets[id]) {
        const last = gymGetLastSession(id);
        state.gymDraftSets[id] = last ? last.sets.map(s => ({...s})) : [{kg:'',reps:''},{kg:'',reps:''},{kg:'',reps:''}];
      }
    }
    render();
  };
  window.gymUpdateSet = (exoId, idx, field, val) => {
    if (!state.gymDraftSets[exoId]) return;
    state.gymDraftSets[exoId][idx][field] = val;
  };
  window.gymAddSet = exoId => {
    if (!state.gymDraftSets[exoId]) state.gymDraftSets[exoId] = [];
    state.gymDraftSets[exoId].push({kg:'',reps:''});
    render();
  };
  window.gymDelSet = (exoId, idx) => {
    if (!state.gymDraftSets[exoId]) return;
    state.gymDraftSets[exoId].splice(idx, 1);
    render();
  };
  window.gymSaveSession = gymSaveSession;
  window.gymDeleteExo = gymDeleteExo;
  window.gymToggleAdd = () => { state.gymAddOpen = !state.gymAddOpen; render(); };
  window.gymSetNewName = v => { state.gymNewExo.name = v; };
  window.gymSetMuscle = m => { state.gymNewExo.muscle = m; render(); };
  window.gymAddExo = () => {
    const name = state.gymNewExo.name.trim();
    if (!name || !state.gymNewExo.muscle) return;
    state.gym.exercises.push({ id: state.gym.nextExoId++, name, muscle: state.gymNewExo.muscle, icon: '🏋️' });
    state.gymNewExo = { name: '', muscle: '', icon: '🏋️' };
    state.gymAddOpen = false;
    saveState(); render();
  };
  window.shiftWeek = delta => { state.weekOffset = (state.weekOffset || 0) + delta; render(); };
  window.goToToday = () => { state.weekOffset = 0; state.selectedDate = getToday(); render(); };
  window.setChartPeriod = p => { state.chartPeriod = p; saveState(); render(); };
  window.setChartType = t => { state.chartType = t; saveState(); render(); };
  window.toggleHabit = toggleHabit;
  window.selectDate = d => { state.selectedDate = d; saveState(); render(); };
  window.toggleEmoji = () => { state.emojiOpen = !state.emojiOpen; render(); };
  window.pickEmoji = e => { state.newIcon = e; state.emojiOpen = false; render(); };
  window.addHabit = addHabit;
  window.deleteHabit = deleteHabit;
  window.setTab = t => { state.tab = t; saveState(); render(); };

  render();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('./sw.js');
      console.log('SW registered');

      const permission = await Notification.requestPermission();
      if (permission === 'granted') {
        reg.active?.postMessage({ type: 'SCHEDULE_NOTIFICATIONS' });
        navigator.serviceWorker.ready.then(r => {
          r.active?.postMessage({ type: 'SCHEDULE_NOTIFICATIONS' });
        });
      }
    } catch(e) {
      console.log('SW error:', e);
    }
  });
}
</script>

</body>
</html>
